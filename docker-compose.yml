version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # El truco maestro: node_modules y .next viven solo en Docker.
      # Tu carpeta local pesará apenas unos KB, ideal para respaldar.
      - node_modules:/app/node_modules
      - .next:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Garantiza el Hot Reload (HMR) impecable
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
  .next: